<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The site's name and icons for a home-screen shortcut, a browser's tab strip and Android (seo-1117: none before). -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpySocial — The Party Game of Social Deception</title>
    <meta name="description" data-rh="true" content="Gather your friends and find the spy — or fool everyone trying. Free real-time multiplayer party game for 3–21 players. Available on iOS and Google Play." />
    <meta name="theme-color" content="#0a111c" />
    <!-- The visitor's light / dark choice and language, set on <html> before the first paint (public/theme.js, public/lang.js) -->
    <script src="/theme.js"></script>
    <script src="/lang.js"></script>
    <!-- The home and legal pages' faces, fetched alongside the script so the first paint already uses them (no swap, no layout shift) -->
    <link rel="preload" href="/src/assets/fonts/big-shoulders-display-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/barlow-500-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The hero's eyebrow, facts and links use Barlow 600 / 700: without them early the hero copy rewraps when they
         swap in and pushes the line-up down (Lighthouse 2026-11-02 on the live site: CLS 0.167, all of it the line-up). -->
    <link rel="preload" href="/src/assets/fonts/barlow-600-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/barlow-700-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Open Graph / Facebook / iMessage / Slack / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SpySocial" />
    <meta property="og:url" content="https://www.spysocial.app/" />
    <meta property="og:title" content="SpySocial — The Party Game of Social Deception" />
    <meta property="og:description" content="Gather your friends and find the spy — or fool everyone trying. Free real-time multiplayer party game for 3–21 players. Available on iOS and Google Play." />
    <!-- The large card (seo-1117, scripts/share-cards.mjs): 1200 x 630 at 2x; each language's file swaps in its own
         (scripts/prerender.mjs localHead), an invite link gets the invite card (vite.config.ts INVITE_PREVIEWS). -->
    <meta property="og:image" content="https://www.spysocial.app/images/share/site-en.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="SpySocial: Trust no one. Five agents in a police line-up, one in the spotlight." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SpySocial — The Party Game of Social Deception" />
    <meta name="twitter:description" content="Gather your friends and find the spy — or fool everyone trying. Free real-time multiplayer party game for 3–21 players. Available on iOS and Google Play." />
    <meta name="twitter:image" content="https://www.spysocial.app/images/share/site-en.jpg" />
    <meta name="twitter:image:alt" content="SpySocial: Trust no one. Five agents in a police line-up, one in the spotlight." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
